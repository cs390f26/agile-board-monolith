openapi: 3.0.3
info:
  title: Project Tracker API
  description: >
    Trello style project tracking system. This spec documents the server
    rendered page routes defined in app.py, plus the JSON API for managers
    adding tasks and engineers, and reading tasks/users back.
  version: 0.1.0

paths:
  /:
    get:
      operationId: getIndexPage
      summary: Landing page
      description: Renders the application's landing page.
      tags:
        - Pages
      responses:
        '200':
          description: HTML landing page
          content:
            text/html:
              schema:
                type: string

  /manager:
    get:
      operationId: getManagerView
      summary: Manager dashboard
      description: >
        Renders the manager dashboard, intended to show ticket status across
        all engineers and projects.
      tags:
        - Pages
      responses:
        '200':
          description: HTML manager dashboard page
          content:
            text/html:
              schema:
                type: string

  /engineer/{name}:
    get:
      operationId: getEngineerView
      summary: Engineer board
      description: >
        Renders an individual engineer's Backlog / In Progress / Done board.
      tags:
        - Pages
      parameters:
        - name: name
          in: path
          required: true
          description: The engineer's name, as it appears in the URL (e.g., "jamell").
          schema:
            type: string
          example: jamell
      responses:
        '200':
          description: HTML engineer board page, rendered for the given engineer
          content:
            text/html:
              schema:
                type: string
        '404':
          description: No engineer found with the given name (once lookups are implemented)

  /api/tasks:
    get:
      operationId: getTasks
      summary: Get tasks
      description: >
        Used by an engineer's board to fetch their tasks. Filter by
        assigneeName to get just one engineer's tasks.
      tags:
        - Tasks
      parameters:
        - name: assigneeName
          in: query
          required: false
          schema:
            type: string
          description: Only return tasks assigned to this engineer.
          example: jamell
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

    post:
      operationId: addTask
      summary: Add a task
      description: Used by a manager to add a new task, assigned to an engineer.
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTask'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid request body

  /api/tasks/{taskId}/inprogress:
    get:
      operationId: getTaskInProgressStatus
      summary: Check if a task can move to In Progress
      description: Returns the task's current status, used before moving it out of Backlog.
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The task's current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found

    post:
      operationId: moveTaskToInProgress
      summary: Move a task to In Progress
      description: Moves a task from Backlog to In Progress.
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task moved to In Progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found

  /api/tasks/{taskId}/done:
    get:
      operationId: getTaskDoneStatus
      summary: Check if a task can move to Done
      description: Returns the task's current status, used before marking it Done.
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The task's current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found

    post:
      operationId: moveTaskToDone
      summary: Move a task to Done
      description: Moves a task from Backlog or In Progress to Done.
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task moved to Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found

  /api/users:
    get:
      operationId: getUsers
      summary: Get users
      description: Used by a manager to see the list of engineers (and managers).
      tags:
        - Users
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [engineer, manager]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      operationId: addUser
      summary: Add an engineer
      description: Used by a manager to add a new engineer (or manager) account.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request body