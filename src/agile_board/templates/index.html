<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Dashboard</title>
    <link rel="stylesheet" href="../static/index.css">
</head>
<body>
<header>
    <div>
        <h1>Project Dashboard</h1>
        <p>Overview of every engineer's tickets</p>
    </div>
    <div class="header-controls">
        <div class="engineer-select">
            <span class="label" for="engineer-filter">Engineer</span>
            <select id="engineer-filter">
                <option value="all">All engineers</option>
            </select>
        </div>
        <a class="manager-btn" href="/manager">Manager</a>
    </div>
</header>

<main>
    <div class="notebook">
        <section class="lane">
            <div class="lane-head">
                <h2>Backlog</h2>
                <span class="count" id="count-backlog">0</span>
            </div>
            <div class="dropzone" id="backlog" data-status="backlog"></div>
        </section>

        <section class="lane">
            <div class="lane-head">
                <h2>In progress</h2>
                <span class="count" id="count-inprogress">0</span>
            </div>
            <div class="dropzone" id="inprogress" data-status="inprogress"></div>
        </section>

        <section class="lane">
            <div class="lane-head">
                <h2>Done</h2>
                <span class="count" id="count-done">0</span>
            </div>
            <div class="dropzone" id="done" data-status="done"></div>
        </section>
    </div>
</main>

<script>
    let tasks = [];
    const select = document.getElementById("engineer-filter");
    const zones = document.querySelectorAll(".dropzone");

    // GET /api/summary_json -> [{ personId, name, tasks: [{ taskId, title, status, personId }] }]
    // Flatten into one task list tagged with the engineer's name (null = unassigned).
    async function loadSummary() {
        const res = await fetch("/api/summary_json");
        if (!res.ok) throw new Error("Failed to load summary: " + res.status);
        const summary = await res.json();

        tasks = summary.flatMap(person =>
            person.tasks.map(task => ({ ...task, engineer: person.name }))
        );

        summary
            .filter(person => person.name !== null)
            .forEach(person => {
                const opt = document.createElement("option");
                opt.value = person.name;
                opt.textContent = person.name;
                select.appendChild(opt);
            });
    }

    function buildCard(task) {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.id = task.taskId;

        const label = document.createElement("span");
        label.className = "card-title";
        label.textContent = task.title;
        card.appendChild(label);

        // Clicking an engineer opens their board at /engineer/<name>
        if (task.engineer) {
            const engineer = document.createElement("a");
            engineer.className = "card-engineer";
            engineer.href = "/engineer/" + encodeURIComponent(task.engineer);
            engineer.textContent = task.engineer;
            card.appendChild(engineer);
        } else {
            const unassigned = document.createElement("span");
            unassigned.className = "card-engineer card-unassigned";
            unassigned.textContent = "Unassigned";
            card.appendChild(unassigned);
        }
        return card;
    }

    function renderBoard() {
        const filter = select.value;
        zones.forEach(zone => zone.innerHTML = "");

        const visible = tasks.filter(t => filter === "all" || t.engineer === filter);

        zones.forEach(zone => {
            const status = zone.dataset.status;
            const cards = visible.filter(t => t.status === status);
            cards.forEach(task => zone.appendChild(buildCard(task)));

            document.getElementById("count-" + zone.id).textContent = cards.length;

            if (cards.length === 0) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = "No tickets here";
                zone.appendChild(empty);
            }
        });
    }

    select.addEventListener("change", renderBoard);
    loadSummary()
        .catch(err => console.error(err))
        .finally(renderBoard);
</script>
</body>
</html>
