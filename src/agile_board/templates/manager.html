<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manager</title>
    <link rel="stylesheet" href="../static/common.css">
    <link rel="stylesheet" href="../static/manager.css">
</head>
<body>
<header>
    <div>
        <h1>Manager</h1>
        <p>Assign work and add engineers to the team</p>
    </div>
    <div class="header-actions">
        <select id="engineer-nav" class="engineer-nav">
            <option value="" disabled selected>Engineers</option>
        </select>
        <a class="dashboard-btn" href="index.html">Dashboard</a>
    </div>
</header>

<main>
    <section class="panel roster-panel">
        <h2>Team</h2>
        <div class="roster" id="roster"></div>
    </section>

    <section class="panel forms-panel">
        <div class="form-card">
            <h2>Create task</h2>
            <form id="create-task-form">
                <label for="task-title">Title</label>
                <input type="text" id="task-title" placeholder="e.g. Write API documentation" required>
                <button type="submit">Create task</button>
            </form>
        </div>

        <div class="form-card">
            <h2>Assign task</h2>
            <form id="assign-task-form">
                <label for="assign-task-select">Task</label>
                <select id="assign-task-select" required></select>

                <label for="assign-person-select">Engineer</label>
                <select id="assign-person-select" required></select>

                <button type="submit">Assign task</button>
            </form>
        </div>

        <div class="form-card">
            <h2>Add engineer</h2>
            <form id="add-engineer-form">
                <label for="engineer-name">Name</label>
                <input type="text" id="engineer-name" placeholder="e.g. Jamell" required>

                <button type="submit">Add engineer</button>
            </form>
        </div>
    </section>
</main>

<script>
    let people = [];
    let tasks = [];

    const statusLabel = { backlog: "Backlog", inprogress: "In progress", done: "Done" };


    async function fetchSummary() {
        const res = await fetch("/api/summary_json");
        if (!res.ok) throw new Error(`Failed to load summary: ${res.status}`);
        const summary = await res.json();

        people = summary.map(person => ({
            peopleId: person.id || person.name,
            name: person.name,
            role: person.role || "engineer"
        }));

        tasks = summary.flatMap(person =>
            (person.tasks || []).map(task => ({
                taskId: task.taskId || task.id,
                title: task.title,
                peopleId: person.id || person.name,
                status: task.status
            }))
        );

        return summary;
    }

    async function postCreateTask(title) {
        const res = await fetch("/api/task/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title })
        });
        if (!res.ok) throw new Error(`Failed to create task: ${res.status}`);
        return await res.json();
    }

    async function postAssignTask(taskId, personId) {
        const res = await fetch(`/api/task/${encodeURIComponent(taskId)}/assign`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ person_id: personId })
        });
        if (!res.ok) throw new Error(`Failed to assign task: ${res.status}`);
        return await res.json();
    }

    async function postCreatePerson(name) {
        const res = await fetch(`/api/people/${encodeURIComponent(name)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name })
        });
        if (!res.ok) throw new Error(`Failed to create engineer: ${res.status}`);
        return await res.json();
    }

    function renderRoster() {
        const roster = document.getElementById("roster");
        roster.innerHTML = "";

        people.forEach(person => {
            const row = document.createElement("div");
            row.className = "roster-row";

            const name = document.createElement("div");
            name.className = "roster-name";
            name.textContent = person.name;
            row.appendChild(name);

            const taskList = document.createElement("div");
            taskList.className = "roster-tasks";

            const personTasks = tasks.filter(t => t.peopleId === person.peopleId);
            if (personTasks.length === 0) {
                const empty = document.createElement("span");
                empty.className = "empty";
                empty.textContent = "No tasks assigned";
                taskList.appendChild(empty);
            } else {
                personTasks.forEach(task => {
                    const chip = document.createElement("span");
                    chip.className = "chip chip-" + task.status;
                    chip.textContent = task.title + " \u2022 " + statusLabel[task.status];
                    taskList.appendChild(chip);
                });
            }

            row.appendChild(taskList);
            roster.appendChild(row);
        });
    }

    function renderFormOptions() {
        const taskSelect = document.getElementById("assign-task-select");
        taskSelect.innerHTML = "";
        tasks.forEach(task => {
            const opt = document.createElement("option");
            opt.value = task.taskId;
            opt.textContent = task.title;
            taskSelect.appendChild(opt);
        });

        const personSelect = document.getElementById("assign-person-select");
        personSelect.innerHTML = "";
        people.forEach(person => {
            const opt = document.createElement("option");
            opt.value = person.peopleId;
            opt.textContent = person.name;
            personSelect.appendChild(opt);
        });
    }

    // Populates the header dropdown with everyone except managers. Picking
    // a name navigates to that engineer's board.
    function renderEngineerNav() {
        const nav = document.getElementById("engineer-nav");
        nav.innerHTML = '<option value="" disabled selected>Engineers</option>';

        people
            .filter(person => person.role !== "manager")
            .forEach(person => {
                const opt = document.createElement("option");
                opt.value = person.name;
                opt.textContent = person.name;
                nav.appendChild(opt);
            });
    }

    function renderAll() {
        renderRoster();
        renderFormOptions();
        renderEngineerNav();
    }

    async function loadAndRenderAll() {
        try {
            await fetchSummary();
            renderAll();
        } catch (err) {
            console.error("Error loading board data:", err)
        }
    }

    document.getElementById("engineer-nav").addEventListener("change", e => {
        const name = e.target.value;
        if (!name) return;
        // Static mockup: query string. In the Flask app this becomes
        // url_for('engineer_view', name=name), i.e. /engineer/<name>.
        window.location.href = "engineer.html?name=" + encodeURIComponent(name);
    });

    // Create task -- stands in for POST /api/task
    document.getElementById("create-task-form").addEventListener("submit", e => {
        e.preventDefault();
        const titleInput = document.getElementById("task-title");
        const title = titleInput.value.trim();
        if (!title) return;

        tasks.push({
            taskId: "t" + (tasks.length + 1),
            title,
            peopleId: null,
            status: "backlog"
        });

        titleInput.value = "";
        renderAll();
    });

    document.getElementById("assign-task-form").addEventListener("submit", e => {
        e.preventDefault();
        const taskId = document.getElementById("assign-task-select").value;
        const personId = document.getElementById("assign-person-select").value;

        const task = tasks.find(t => t.taskId === taskId);
        if (task) task.peopleId = personId;

        renderAll();
    });

    document.getElementById("add-engineer-form").addEventListener("submit", e => {
        e.preventDefault();
        const nameInput = document.getElementById("engineer-name");
        const name = nameInput.value.trim();
        if (!name) return;

        const peopleId = "p" + (people.length + 1);
        people.push({ peopleId, name, role: "engineer" });

        nameInput.value = "";
        renderAll();
    });

    renderAll();
</script>
</body>
</html>
