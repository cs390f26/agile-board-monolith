<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Engineer Dashboard</title>
    <link rel="stylesheet" href="../static/common.css">
    <link rel="stylesheet" href="../static/engineer.css">
</head>
<body>
<header>
    <div>
        <h1>{{ name }}'s tasks</h1>
        <p>Drag a ticket to a new lane to update its status</p>
    </div>
    <a class="dashboard-btn" href="index.html">Dashboard</a>
</header>

<main>
    <div class="notebook">
        <section class="lane">
            <div class="lane-head">
                <h2>Backlog</h2>
                <span class="count" id="count-backlog">0</span>
            </div>
            <div class="dropzone" id="backlog" data-status="backlog"></div>
        </section>

        <section class="lane">
            <div class="lane-head">
                <h2>In progress</h2>
                <span class="count" id="count-inprogress">0</span>
            </div>
            <div class="dropzone" id="inprogress" data-status="inprogress"></div>
        </section>

        <section class="lane">
            <div class="lane-head">
                <h2>Done</h2>
                <span class="count" id="count-done">0</span>
            </div>
            <div class="dropzone" id="done" data-status="done"></div>
        </section>
    </div>
</main>

<script>
    const currentPersonId = "{{ person_id }}";
    const tasks = [];
    const zones = document.querySelectorAll(".dropzone");

    async function fetchEngineerTasks() {
        const res = await fetch(`/api/people/${encodeURIComponent(currentPersonId)}/tasks`);
        if (!res.ok) throw new Error(`Failed to fetch tasks: ${res.status}`);
        const data = await res.json();
        tasks = Array.isArray(data) ? data : (data.tasks || []);
        return tasks;
    }

    async function postTaskInProgress(taskId) {
        const res = await fetch(`/api/task/${encodeURIComponent(taskId)}/${encodeURIComponent(currentPersonId)}/inprogress`, {
            method: "POST",
            headers: { "Content-Type": "application/json" }
        });
        if (!res.ok) throw new Error(`Failed to update task to inprogress: ${res.status}`);
        return await res.json();
    }

    async function postTaskDone(taskId) {
        const res = await fetch(`/api/task/${encodeURIComponent(taskId)}/${encodeURIComponent(currentPersonId)}/done`, {
            method: "POST",
            headers: { "Content-Type": "application/json" }
        });
        if (!res.ok) throw new Error(`Failed to update task to done: ${res.status}`);
        return await res.json();
    }
    

    function buildCard(task) {
        const card = document.createElement("div");
        card.className = "card";
        card.draggable = true;
        card.dataset.id = task.id || task.taskId;

        const label = document.createElement("span");
        label.textContent = task.title || task.name;
        card.appendChild(label);

        card.addEventListener("dragstart", () => card.classList.add("dragging"));
        card.addEventListener("dragend", () => {
            card.classList.remove("dragging");
            zones.forEach(z => z.classList.remove("over"));
            await syncBoard();
        });
        return card;
    }

    async function syncBoard() {
        zones.forEach(zone => {
            const cards = zone.querySelectorAll(".card");
            cards.forEach(async card => {
                const task = tasks.find(t => String(t.id) === card.dataset.id);
                if (task && task.status !== zone.dataset.status) {
                    const newStatus = zone.dataset.status;
                    task.status = newStatus;

                    try {
                        if (newStatus === "inprogress") {
                            await postTaskInProgress(task.id || task.taskId);
                        } else if (newStatus === "done") {
                            await postTaskDone(task.id || task.taskId);
                        }
                    } catch (err) {
                        console.error("Failed to update status on server:", err);
                    }
                }
            });
            document.getElementById("count-" + zone.id).textContent = cards.length;

            let empty = zone.querySelector(".empty");
            if (cards.length === 0 && !empty) {
                empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = "No tickets here";
                zone.appendChild(empty);
            } else if (cards.length > 0 && empty) {
                empty.remove();
            }
        });
    }

        function cardAfterCursor(zone, y) {
        const others = [...zone.querySelectorAll(".card:not(.dragging)")];
        let closest = { offset: Number.NEGATIVE_INFINITY, el: null };
        others.forEach(el => {
            const box = el.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) closest = { offset, el };
        });
        return closest.el;
    }

    function setupDragAndDrop() {
        zones.forEach(zone => {
        zone.addEventListener("dragover", e => {
            e.preventDefault();
            zone.classList.add("over");
            const dragging = document.querySelector(".dragging");
            if (!dragging) return;
            const empty = zone.querySelector(".empty");
            if (empty) empty.remove();
            const next = cardAfterCursor(zone, e.clientY);
            if (next) zone.insertBefore(dragging, next);
            else zone.appendChild(dragging);
        });
        zone.addEventListener("dragleave", e => {
            if (!zone.contains(e.relatedTarget)) zone.classList.remove("over");
        });
        zone.addEventListener("drop", e => e.preventDefault());
    });
    }

    async function init() {
        setupDragAndDrop();
        try {
            await fetchEngineerTasks();
            tasks.forEach(task => {
                const lane = document.getElementById(task.status);
                if (lane) lane.appendChild(buildCard(task));
            });
            await syncBoard();
        } catch (err) {
            console.error("Error loading board:", err)
        }
    }

    init();
</script>
</body>
</html>
